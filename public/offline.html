<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - E-Survey Deli Serdang</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f4f6f8;
            color: #052e1c;
            text-align: center;
            padding: 24px;
        }

        .box {
            max-width: 360px;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 8px;
        }

        p {
            margin: 0 0 20px;
            color: #4b5563;
        }

        button {
            background: #0d6e3f;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="icon">📡</div>
        <h1>Tidak Ada Koneksi Internet</h1>
        <p>Halaman ini butuh koneksi internet untuk memuat data terbaru. Silakan periksa koneksi Anda dan coba lagi.</p>
        <button onclick="location.reload()">Coba Lagi</button>
    </div>
</body>

</html>
